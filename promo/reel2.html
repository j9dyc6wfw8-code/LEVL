<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LEVL — Reel HYPE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#05060a; }
  body {
    font-family:-apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased; color:#fff;
  }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#0b0d13; }
  #world { position:absolute; inset:0; will-change:transform; }
  .scene { position:absolute; inset:0; will-change:transform,opacity; }
  .num { font-variant-numeric:tabular-nums; }
  svg { display:block; }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script>
/* ============================================================================
   LEVL — promotional reel, HYPE CUT (1080x1920)

   Same source of truth as the calm cut: colours, icons, tiers, stats and copy
   all come out of the repo (theme.js / engine.js / TabIcon.js / routes.js /
   app.json). What changes is the EDIT — a 150 BPM cut grid, a moving light rig,
   RGB split, glitch slicing, shockwaves, sparks and zoom-blur ghosting.

   Deterministic: window.renderAt(t) fully describes the frame at time t.
   ========================================================================== */

/* ---------------------------------------------------------------- tokens -- */
const C = {
  sunken:'#090a0f', bg:'#0b0d13', bgElev:'#141720', panel:'#181c27',
  panel2:'#1f2431', panel3:'#272d3d', line:'#2c3344', lineSoft:'#212736',
  text:'#ffffff', mut:'#a7b0c0', dim:'#6b7488', faint:'#464e60', ink:'#0e1016',
  gold:'#ffc933', goldDeep:'#d99a1c',
  green:'#2fe39b', red:'#ff5c6e', purp:'#a66bff', blue:'#3d9bff',
  cyan:'#2fe0e0', orange:'#ff8a3d', pink:'#ff5fa2',
};
const TIERS = [
  { name:'Bronze',      min:0,    color:'#cd7f4a' },
  { name:'Silver',      min:600,  color:'#c3ccdb' },
  { name:'Gold',        min:1200, color:'#ffc933' },
  { name:'Platinum',    min:1800, color:'#2fe0e0' },
  { name:'Diamond',     min:2400, color:'#3d9bff' },
  { name:'Champion',    min:3000, color:'#a66bff' },
  { name:'Grandmaster', min:3600, color:'#ff4d6d' },
];
const STATS = [
  { k:'STR', name:'Strength',   c:'#ff5c6e', v:0.86 },
  { k:'PWR', name:'Power',      c:'#ff8a3d', v:0.72 },
  { k:'END', name:'Endurance',  c:'#2fe39b', v:0.64 },
  { k:'VIT', name:'Vitality',   c:'#3d9bff', v:0.79 },
  { k:'MOB', name:'Mobility',   c:'#2fe0e0', v:0.55 },
  { k:'DIS', name:'Discipline', c:'#a66bff', v:0.91 },
];
const RARITY = [
  { k:'common',    c:'#8e97a8', label:'Common'    },
  { k:'rare',      c:'#3d9bff', label:'Rare'      },
  { k:'epic',      c:'#a66bff', label:'Epic'      },
  { k:'legendary', c:'#ff8a3d', label:'Legendary' },
  { k:'mythic',    c:'#ff4d6d', label:'Mythic'    },
];
const ICONS = {
  train:   `<line x1="8" y1="12" x2="16" y2="12"/><rect x="3.5" y="9" width="3" height="6" rx="1"/><rect x="17.5" y="9" width="3" height="6" rx="1"/><line x1="2.5" y1="10.5" x2="2.5" y2="13.5"/><line x1="21.5" y1="10.5" x2="21.5" y2="13.5"/>`,
  duel:    `<path d="M5 4 L14 13 L13 15 L11 16 L4 9 Z"/><path d="M19 4 L10 13 L11 15 L13 16 L20 9 Z"/><line x1="12" y1="14" x2="12" y2="20"/>`,
  social:  `<rect x="3" y="6.5" width="18" height="13.5" rx="3"/><path d="M8.4 6.5 L9.7 4 H14.3 L15.6 6.5"/><circle cx="12" cy="13.2" r="3.8"/>`,
  profile: `<path d="M12 3 L20 6 V11 C20 16 16.5 19.5 12 21 C7.5 19.5 4 16 4 11 V6 Z"/><path d="M12 8 L13 11 L16 11 L13.5 13 L14.5 16 L12 14 L9.5 16 L10.5 13 L8 11 L11 11 Z"/>`,
  shop:    `<path d="M6 8 H18 L19 20 H5 Z"/><path d="M9 8 V6.5 A3 3 0 0 1 15 6.5 V8"/>`,
  packs:   `<path d="M12 3 L20 7 V16 L12 21 L4 16 V7 Z"/><polyline points="4,7 12,11 20,7"/><line x1="12" y1="11" x2="12" y2="21"/><line x1="8" y1="5" x2="16" y2="9"/>`,
};
function icon(name, size, color, sw) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}"
    stroke-width="${sw||1.9}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}
const TABS = [
  { key:'train', label:'Train', icon:'train' }, { key:'compete', label:'Compete', icon:'duel' },
  { key:'social', label:'Social', icon:'social' }, { key:'hunter', label:'Hunter', icon:'profile' },
  { key:'forge', label:'Forge', icon:'shop' },
];
const L_PATH = 'M39.1,30.6 H49.8 V59.8 L70.3,51.3 V61.7 L49.8,69.3 H39.1 Z';

/* ----------------------------------------------------------------- utils -- */
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const lerp = (a,b,t) => a + (b-a)*t;
const seg = (t,a,b) => clamp01((t-a)/(b-a));
const E = {
  linear:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  outQuart:t=>1-Math.pow(1-t,4),
  outQuint:t=>1-Math.pow(1-t,5),
  outExpo:t=>t>=1?1:1-Math.pow(2,-11*t),
  inCubic:t=>t*t*t,
  inQuart:t=>t*t*t*t,
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  outSpring:t=>t>=1?1:1-Math.exp(-6.6*t)*Math.cos(8.2*t),
  // hard slam: overshoots once, settles fast — the workhorse of this cut
  slam:t=>t>=1?1:1-Math.exp(-9*t)*Math.cos(11*t),
};
function el(tag, parent, css, html) {
  const n = document.createElement(tag);
  if (css) Object.assign(n.style, css);
  if (html != null) n.innerHTML = html;
  (parent||world).appendChild(n);
  return n;
}
const px = v => v+'px';
const fmt = n => Math.round(n).toLocaleString('en-US');
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rgba(hex,a){ const h=hex.replace('#',''); return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${a})`; }
// RGB split on type — the cheapest convincing chromatic aberration there is
function chroma(node, amt){
  node.style.textShadow = amt > 0.15
    ? `${amt}px 0 ${rgba('#ff2d55',0.9)}, ${-amt}px 0 ${rgba('#2fe0e0',0.9)}`
    : 'none';
}

/* ------------------------------------------------------------ beat grid -- */
const BPM  = 150;
const B    = 60/BPM;          // 0.4s — one beat
const BAR  = B*4;             // 1.6s

/* Scene table. Hard cuts, no crossfades: the cut IS the transition. */
const SCENES = [
  { id:'boot',    t0:0.00,  t1:2.00 },
  { id:'hook',    t0:2.00,  t1:4.00 },
  { id:'train',   t0:4.00,  t1:7.60 },
  { id:'stats',   t0:7.60,  t1:10.80 },
  { id:'rank',    t0:10.80, t1:14.00 },
  { id:'duel',    t0:14.00, t1:17.20 },
  { id:'checkin', t0:17.20, t1:19.20 },
  { id:'forge',   t0:19.20, t1:21.60 },
  { id:'cta',     t0:21.60, t1:25.20 },
];
const DURATION = SCENES[SCENES.length-1].t1;

/* IMPACTS — every hit the whole frame reacts to: shake, flash, aberration,
   speed lines. Beat-locked so the piece reads as cut to music even silent. */
const IMPACTS = [
  0.80, 1.20, 1.60,
  2.00, 2.50, 3.00, 3.50,
  4.00, 4.80, 5.20, 5.60, 6.40, 7.20,
  7.60, 8.40, 9.20, 10.00,
  10.80, 11.60, 12.40, 13.20,
  14.00, 14.80, 15.60, 16.40,
  17.20, 18.20,
  19.20, 20.00, 20.80,
  21.60, 22.40, 23.20,
];
// strongest hits — these also get a white frame + big shockwave
const HEAVY = new Set([0.80, 4.80, 5.60, 10.80, 13.20, 14.80, 16.40, 18.20, 21.60]);

function impactAt(t, decay){
  decay = decay || 0.16;
  let v = 0, heavy = 0;
  for (const i of IMPACTS){
    const d = t - i;
    if (d >= 0 && d < decay*5){
      const e = Math.exp(-d/decay);
      if (e > v) v = e;
      if (HEAVY.has(i) && e > heavy) heavy = e;
    }
  }
  return { v, heavy };
}

/* The white frame is a STROBE, not a glow: ~6 frames on a heavy hit and gone.
   Decaying it on the same curve as the shake washes the whole picture out. */
function flashAt(t){
  let v = 0;
  for (const i of IMPACTS){
    const d = t - i;
    if (d >= 0 && d < 0.10){
      const amt = (HEAVY.has(i) ? 0.78 : 0.14) * Math.pow(1 - d/0.10, 2.0);
      if (amt > v) v = amt;
    }
  }
  return v;
}

/* ============================================================== BACKDROP == */

/* --- light rig: three big coloured blobs sweeping like stage lights ------- */
const rig = [
  { c:C.gold, s:0.95, a:0.30, sp:[0.61,0.43], ph:0.0  },
  { c:C.cyan, s:0.75, a:0.20, sp:[0.44,0.72], ph:2.1  },
  { c:C.purp, s:0.80, a:0.18, sp:[0.83,0.31], ph:4.2  },
].map(L => ({
  L,
  n: el('div', world, {
    position:'absolute', left:'50%', top:'50%', width:'1500px', height:'1500px',
    marginLeft:'-750px', marginTop:'-750px', pointerEvents:'none', mixBlendMode:'screen',
    background:`radial-gradient(circle, ${rgba(L.c,0.5)} 0%, ${rgba(L.c,0.14)} 34%, rgba(0,0,0,0) 66%)`,
  })
}));

/* --- perspective grid floor (fast, receding) ----------------------------- */
const gridFloor = el('div', world, {
  position:'absolute', left:'-60%', right:'-60%', bottom:'-6%', height:'62%',
  transform:'perspective(560px) rotateX(74deg)', transformOrigin:'50% 100%',
  pointerEvents:'none', opacity:'0.5',
  backgroundImage:
    `repeating-linear-gradient(90deg, ${rgba(C.gold,0.5)} 0 2px, rgba(0,0,0,0) 2px 92px),`+
    `repeating-linear-gradient(0deg, ${rgba(C.gold,0.38)} 0 2px, rgba(0,0,0,0) 2px 92px)`,
  WebkitMaskImage:'linear-gradient(0deg, #000 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0) 100%)',
});
// mirrored ceiling grid — doubles the "inside a machine" feel
const gridSky = el('div', world, {
  position:'absolute', left:'-60%', right:'-60%', top:'-6%', height:'46%',
  transform:'perspective(560px) rotateX(-74deg)', transformOrigin:'50% 0%',
  pointerEvents:'none', opacity:'0.26',
  backgroundImage:
    `repeating-linear-gradient(90deg, ${rgba(C.cyan,0.45)} 0 2px, rgba(0,0,0,0) 2px 92px),`+
    `repeating-linear-gradient(0deg, ${rgba(C.cyan,0.32)} 0 2px, rgba(0,0,0,0) 2px 92px)`,
  WebkitMaskImage:'linear-gradient(180deg, #000 0%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0) 100%)',
});

/* --- volumetric beams ----------------------------------------------------- */
const beams = [0,1,2].map(i => el('div', world, {
  position:'absolute', left:'50%', top:'-30%', width:'150px', height:'170%',
  marginLeft:'-75px', pointerEvents:'none', mixBlendMode:'screen',
  transformOrigin:'50% 0%',
  background:`linear-gradient(180deg, ${rgba(i===1?C.cyan:C.gold,0.30)} 0%, rgba(0,0,0,0) 78%)`,
  filter:'blur(22px)',
}));

/* ================================================================ SCENES == */
const S = {};
SCENES.forEach(sc => { S[sc.id] = el('div', world, { position:'absolute', inset:'0', opacity:'0' }); S[sc.id].className='scene'; });

/* --------------------------------------------- shared: shockwaves/sparks -- */
function makeShockwave(parent, colour){
  return el('div', parent, {
    position:'absolute', left:'50%', top:'50%', width:'300px', height:'300px',
    marginLeft:'-150px', marginTop:'-150px', borderRadius:'999px',
    border:'6px solid '+colour, opacity:'0', pointerEvents:'none',
  });
}
function driveShockwave(node, p, maxScale, cx, cy){
  if (p <= 0 || p >= 1){ node.style.opacity = '0'; return; }
  node.style.opacity = String(Math.pow(1-p, 2.1));
  node.style.transform =
    `translate(${(cx||0)}px, ${(cy||0)}px) scale(${lerp(0.25, maxScale||5.2, E.outQuart(p))})`;
  node.style.borderWidth = px(Math.max(1, lerp(9, 1, p)));
}
function makeSparks(parent, n, colour, seed){
  const rnd = mulberry32(seed);
  return Array.from({length:n}, () => {
    const ang = rnd()*Math.PI*2, dist = 220 + rnd()*520, sz = 4 + rnd()*9;
    const node = el('div', parent, {
      position:'absolute', left:'50%', top:'50%', width:px(sz), height:px(sz),
      borderRadius:'999px', background:colour, opacity:'0', pointerEvents:'none',
      boxShadow:`0 0 ${12+rnd()*22}px ${colour}`,
    });
    return { node, ang, dist, delay: rnd()*0.10 };
  });
}
function driveSparks(list, p, cx, cy){
  list.forEach(s => {
    const q = clamp01((p - s.delay) / (1 - s.delay));
    if (p <= 0 || q <= 0 || q >= 1){ s.node.style.opacity='0'; return; }
    const e = E.outQuart(q);
    s.node.style.opacity = String(Math.pow(1-q, 1.7));
    s.node.style.transform =
      `translate(${(cx||0) + Math.cos(s.ang)*s.dist*e}px, ${(cy||0) + Math.sin(s.ang)*s.dist*e + q*q*130}px)`;
  });
}

/* ======================================================== SCENE 1 — BOOT == */
{
  const root = S.boot;
  var bootSys = el('div', root, {
    position:'absolute', left:'0', right:'0', top:'760px', textAlign:'center',
    fontSize:'40px', fontWeight:'700', letterSpacing:'16px', color:C.cyan,
  }, 'SYSTEM ONLINE');

  // zoom-blur ghost stack for the icon — five copies fake a radial blur
  var bootGhosts = [0,1,2,3,4].map(i => el('div', root, {
    position:'absolute', left:'50%', top:'900px', width:'300px', height:'300px',
    marginLeft:'-150px', marginTop:'-150px', borderRadius:'70px',
    background:'linear-gradient(150deg,#ffe08a 0%,#ffc933 45%,#e5a51f 100%)',
    display:'flex', alignItems:'center', justifyContent:'center', opacity:'0',
  }, `<svg width="300" height="300" viewBox="0 0 100 100"><path d="${L_PATH}" fill="#0e1016"/></svg>`));

  var bootRing1 = makeShockwave(root, rgba(C.gold,0.9));
  var bootRing2 = makeShockwave(root, rgba(C.cyan,0.75));
  var bootSparks = makeSparks(root, 30, C.gold, 991);

  var bootWord = el('div', root, {
    position:'absolute', left:'0', right:'0', top:'1150px', textAlign:'center',
    fontSize:'190px', fontWeight:'800', color:'#fff',
  }, 'LEVL');

  S.boot.update = function(t){
    // 0.0–0.8 glitchy boot text, 0.8 icon SLAM, 1.2 wordmark, 1.6 tighten
    const sy = seg(t,0.05,0.30);
    bootSys.style.opacity = String(sy * (1 - seg(t,0.70,0.86)));
    bootSys.style.transform = `scale(${lerp(1.25,1,E.outQuint(seg(t,0.05,0.55)))})`;
    chroma(bootSys, lerp(26,1,E.outCubic(seg(t,0.05,0.62))));

    // icon slam with ghost trail
    const slam = seg(t,0.80,1.30);
    bootGhosts.forEach((g,i) => {
      if (slam <= 0){ g.style.opacity='0'; return; }
      const lag = i*0.055;
      const q = E.slam(clamp01((slam - lag)/(1 - lag)));
      const sc = lerp(3.4, 1, q);
      g.style.opacity = String(i===0 ? seg(t,0.80,0.84) : Math.max(0, 0.30 - i*0.06) * (1-E.outCubic(slam)));
      g.style.transform = `scale(${sc}) rotate(${lerp(-22,0,q)}deg)`;
    });
    driveShockwave(bootRing1, seg(t,0.80,1.45), 6.0);
    driveShockwave(bootRing2, seg(t,0.86,1.60), 8.0);
    driveSparks(bootSparks, seg(t,0.80,1.55));

    const w = seg(t,1.20,1.75);
    bootWord.style.opacity = seg(t,1.20,1.26);
    bootWord.style.letterSpacing = px(lerp(120,14,E.outExpo(w)));
    bootWord.style.transform = `scale(${lerp(1.3,1,E.slam(w))})`;
    chroma(bootWord, lerp(30,0,E.outCubic(seg(t,1.20,1.70))));
  };
}

/* ======================================================== SCENE 2 — HOOK == */
{
  const root = S.hook;
  const WORDS = [
    { txt:'TRAIN',  c:C.gold, t:0.00 },
    { txt:'TRACK',  c:C.cyan, t:0.50 },
    { txt:'RANK',   c:C.purp, t:1.00 },
    { txt:'REPEAT', c:C.gold, t:1.50 },
  ];
  var hookWords = WORDS.map(W => {
    const n = el('div', root, {
      position:'absolute', left:'0', right:'0', top:'840px', textAlign:'center',
      fontSize:'210px', fontWeight:'800', letterSpacing:'-7px', color:W.c, opacity:'0',
    }, W.txt);
    // oversized outlined echo behind the word — gives the frame scale
    const echo = el('div', root, {
      position:'absolute', left:'0', right:'0', top:'786px', textAlign:'center',
      fontSize:'300px', fontWeight:'800', letterSpacing:'-10px', opacity:'0',
      color:'transparent', WebkitTextStroke:'3px '+rgba(W.c,0.30), pointerEvents:'none',
    }, W.txt);
    root.insertBefore(echo, n);   // echo sits BEHIND the solid word
    return { n, echo, ...W };
  });
  // horizontal glitch slices that tear the word on entry
  var hookSlices = [0,1,2,3,4].map(i => el('div', root, {
    position:'absolute', left:'0', right:'0', top:px(846 + i*38), height:'30px',
    background:C.gold, opacity:'0', mixBlendMode:'overlay',
  }));
  var hookBar = el('div', root, {
    position:'absolute', left:'50%', top:'1090px', width:'640px', height:'10px',
    marginLeft:'-320px', background:C.gold, borderRadius:'9px', opacity:'0',
    boxShadow:'0 0 50px '+rgba(C.gold,0.8),
  });

  S.hook.update = function(t){
    hookWords.forEach(W => {
      const on = t >= W.t && t < W.t + 0.5;
      if (!on){ W.n.style.opacity = '0'; W.echo.style.opacity = '0'; return; }
      const q = seg(t, W.t, W.t+0.34);
      W.n.style.opacity = '1';
      W.n.style.transform = `scale(${lerp(1.7,1,E.slam(q))}) skewX(${lerp(-14,0,E.outQuart(q))}deg)`;
      chroma(W.n, lerp(34,0,E.outCubic(seg(t,W.t,W.t+0.26))));
      W.n.style.filter = `blur(${lerp(14,0,E.outQuart(seg(t,W.t,W.t+0.16)))}px)`;
      // echo drifts the opposite way, a beat behind
      W.echo.style.opacity = String(0.9 * (1 - seg(t, W.t+0.10, W.t+0.5)));
      W.echo.style.transform = `scale(${lerp(0.72,1.14,E.outQuart(q))})`;
    });
    // slices flicker for the first 0.12s of each word
    const rnd = mulberry32(Math.round(t*1000));
    const inSlice = WORDS.some(W => t >= W.t && t < W.t + 0.13);
    hookSlices.forEach(s => {
      if (!inSlice){ s.style.opacity='0'; return; }
      s.style.opacity = rnd() > 0.55 ? String(0.35 + rnd()*0.4) : '0';
      s.style.transform = `translateX(${(rnd()-0.5)*220}px) scaleY(${0.4+rnd()})`;
    });
    const bp = seg(t,1.50,1.95);
    hookBar.style.opacity = bp>0 ? '1' : '0';
    hookBar.style.transform = `scaleX(${E.outExpo(bp)})`;
  };
}

/* ------------------------------------------------- shared: phone mockup --- */
const PHONE_SCALE = 0.80;
function makePhone(parent, opts){

  const W = 620, H = 1344;
  const root = el('div', parent, {
    position:'absolute', left:'50%', top:px(opts.top||860), width:px(W), height:px(H),
    marginLeft:px(-W/2), marginTop:px(-H/2), transformOrigin:'50% 50%',
  });
  el('div', root, {
    position:'absolute', inset:'0', borderRadius:'78px',
    background:'linear-gradient(150deg,#4a5265 0%,#242a37 30%,#3b4354 60%,#1d222c 100%)',
    boxShadow:'0 60px 150px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.07), 0 0 90px '+rgba(C.gold,0.20),
  });
  const screen = el('div', root, {
    position:'absolute', left:'13px', top:'13px', right:'13px', bottom:'13px',
    borderRadius:'66px', overflow:'hidden', background:C.bg,
  });
  el('div', root, {
    position:'absolute', left:'50%', top:'40px', width:'132px', height:'38px',
    marginLeft:'-66px', borderRadius:'999px', background:'#000', zIndex:'40',
  });
  el('div', screen, { position:'absolute', left:'44px', top:'42px', fontSize:'23px', fontWeight:'600', zIndex:'30' }, '9:41');
  el('div', screen, {

{

       <path id="sweep" fill="url(#sweepG)"/>
       <g id="dots"></g>
     </svg>`);
  const NS='http://www.w3.org/2000/svg';
  const grid=radar.querySelector('#grid'), spokes=radar.querySelector('#spokes');
  const fillPoly=radar.querySelector('#fillPoly'), dotsG=radar.querySelector('#dots');
  const sweep=radar.querySelector('#sweep');
  const ang = i => (-Math.PI/2) + i*(Math.PI*2/6);
  const ptAt = (i,r) => [CX + Math.cos(ang(i))*r, CY + Math.sin(ang(i))*r];

  for (let ring=1; ring<=4; ring++){
    const pts=[]; for(let i=0;i<6;i++){const[x,y]=ptAt(i,R*ring/4); pts.push(x.toFixed(1)+','+y.toFixed(1));}
    const poly=document.createElementNS(NS,'polygon');
    poly.setAttribute('points',pts.join(' ')); poly.setAttribute('fill','none');
    poly.setAttribute('stroke', ring===4?C.line:C.lineSoft);
    poly.setAttribute('stroke-width', ring===4?2.5:1.6);
    grid.appendChild(poly);
  }
  for(let i=0;i<6;i++){
    const[x,y]=ptAt(i,R);
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',CX);ln.setAttribute('y1',CY);ln.setAttribute('x2',x);ln.setAttribute('y2',y);
    ln.setAttribute('stroke',C.lineSoft);ln.setAttribute('stroke-width',1.6);
    spokes.appendChild(ln);
  }
  var statDots = STATS.map(st=>{
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('r',13); c.setAttribute('fill',st.c);
    c.setAttribute('stroke',C.bg); c.setAttribute('stroke-width',4);
    dotsG.appendChild(c); return c;
  });
  var statLabels = STATS.map((st,i)=>{
    const [x,y]=ptAt(i,R+108);
    const n = el('div', root, {
      position:'absolute', left:px(x-110), top:px(y-50), width:'220px', textAlign:'center', opacity:'0',
    }, `<div style="font-size:44px;font-weight:800;letter-spacing:2px;color:${st.c};text-shadow:0 0 30px ${rgba(st.c,0.85)}">${st.k}</div>
        <div class="valn" style="font-size:34px;font-weight:700;color:#fff;margin-top:4px;font-variant-numeric:tabular-nums">0</div>`);
    return { n, val:n.querySelector('.valn'), st };
  });
  var statTitle = el('div', root, {
    position:'absolute', left:'0', right:'0', top:'300px', textAlign:'center',
    fontSize:'92px', fontWeight:'800', letterSpacing:'-2px', opacity:'0',

  var statRing = makeShockwave(root, rgba(C.gold,0.85));

  S.stats.update = function(t){
    radar.style.opacity = String(seg(t,0.06,0.20));
    const grow = E.outExpo(seg(t,0.10,0.95));
    const pts=[];
    STATS.forEach((st,i)=>{
      const stagger = clamp01((grow*1.4) - i*0.05);
      const [x,y]=ptAt(i, Math.max(R*st.v*E.outCubic(stagger), 2));
      pts.push(x.toFixed(1)+','+y.toFixed(1));
      statDots[i].setAttribute('cx',x); statDots[i].setAttribute('cy',y);
      statDots[i].setAttribute('opacity', stagger>0.02?1:0);
      // labels fire on 16ths
      const ls = 0.30 + i*0.10;
      const lq = seg(t, ls, ls+0.26);
      statLabels[i].n.style.opacity = String(lq);

      statLabels[i].val.textContent = Math.round(lerp(0, st.v*100, E.outExpo(seg(t, ls, ls+0.75))));
    });
    fillPoly.setAttribute('points', pts.join(' '));

    // sonar sweep wedge rotating around the hexagon
    const sw = seg(t,0.15,2.30);

      sweep.setAttribute('opacity', 0.55*(1-sw*0.4));
    } else sweep.setAttribute('opacity',0);

    const tp = seg(t,0.02,0.34);
    statTitle.style.opacity = String(tp);
    statTitle.style.transform = `scale(${lerp(1.5,1,E.slam(tp))})`;

  };

/* ================================================================ RENDER == */
window.renderAt = function(t){
  t = Math.max(0, Math.min(DURATION - 0.0001, t));
  const frame = Math.round(t*60);
  const rnd = mulberry32(frame*2654435761 % 2147483647);
  const imp = impactAt(t);

  // --- scenes: hard cuts, one visible at a time
  SCENES.forEach(sc => {
    const node = S[sc.id];
    const on = t >= sc.t0 && t < sc.t1;
    if (!on){ node.style.opacity='0'; node.style.visibility='hidden'; return; }
    node.style.visibility='visible';
    node.style.opacity='1';
    // every scene gets a subtle beat-locked zoom so nothing sits still
    const local = t - sc.t0;
    const zoom = 1 + imp.v*0.030 + Math.sin(local*Math.PI/ (sc.t1-sc.t0))*0.004;
    node.style.transform = `scale(${zoom})`;
    if (node.update) node.update(local);
  });

  // --- light rig sweeps
  const g = t/DURATION;
  rig.forEach((r,i) => {
    const L = r.L;
    const x = Math.sin(t*L.sp[0] + L.ph)*430;
    const y = Math.cos(t*L.sp[1] + L.ph)*560;
    const pulse = 1 + imp.v*0.28;
    r.n.style.transform = `translate(${x}px, ${y}px) scale(${L.s*pulse})`;
    r.n.style.opacity = String(L.a * (0.72 + 0.28*Math.sin(t*2.1 + L.ph)) + imp.v*0.14);
  });

  // --- grids scroll toward the viewer, accelerating on every hit
  const scroll = (t*260 + imp.v*90) % 92;
  gridFloor.style.backgroundPosition = `0px ${scroll}px, 0px ${scroll}px`;
  gridFloor.style.opacity = String(0.62 + imp.v*0.34);
  gridSky.style.backgroundPosition = `0px ${-scroll}px, 0px ${-scroll}px`;
  gridSky.style.opacity = String(0.34 + imp.v*0.26);

  // --- beams fan on the beat
  beams.forEach((b,i) => {
    const a = Math.sin(t*(0.7+i*0.23) + i*2.0)*26;
    b.style.transform = `rotate(${a}deg) scaleY(${1 + imp.v*0.1})`;
    b.style.opacity = String((0.30 + imp.v*0.55) * (i===1?0.8:1));
  });

  // --- camera shake + push on impacts
  const sh = imp.v;
  const shakeX = (rnd()-0.5)*26*sh, shakeY = (rnd()-0.5)*26*sh;
  const rot = (rnd()-0.5)*0.9*sh;
  world.style.transform = `translate(${shakeX}px, ${shakeY}px) rotate(${rot}deg) scale(${1 + sh*0.012})`;

  // --- chromatic aberration pulses with the hit (cubed: sharp, not hazy)
  const ab = sh*sh*sh;
  chromaR.style.opacity = String(ab*0.34);
  chromaR.style.transform = `translateX(${ab*18}px)`;
  chromaC.style.opacity = String(ab*0.34);
  chromaC.style.transform = `translateX(${-ab*18}px)`;

  // --- speed lines rip outward on the heavy hits
  speedLines.style.opacity = String(Math.pow(imp.heavy,1.5)*0.5);
  speedLines.style.transform = `rotate(${t*14}deg) scale(${1 + imp.heavy*0.28})`;

  // --- glitch tearing, heaviest hits only
  const tear = imp.heavy;
  glitchBars.forEach(b => {
    if (tear < 0.30){ b.style.opacity='0'; return; }
    const top = rnd()*1920, h = 14 + rnd()*80;
    b.style.top = px(top); b.style.height = px(h);
    b.style.opacity = String(tear * (0.35 + rnd()*0.5));
    b.style.background = rnd()>0.5 ? rgba(C.cyan,0.55) : rgba('#ff2d55',0.5);
    b.style.transform = `translateX(${(rnd()-0.5)*260*tear}px)`;
  });

  // --- white frame on the heavy hits, plus a small lift on every hit
  flash.style.opacity = String(flashAt(t));

  scanlines.style.opacity = String(0.10 + imp.v*0.10);
  grain.style.backgroundPosition = `${Math.floor(rnd()*220)}px ${Math.floor(rnd()*220)}px`;
  grain.style.opacity = String(0.06 + imp.v*0.05);
};

window.DURATION = DURATION;
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
