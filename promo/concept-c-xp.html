<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LEVL — Every Set Gives XP</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#05060a}
  body{font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0d13}
  #world{position:absolute;inset:0;will-change:transform}
  svg{display:block}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="levl-kit.js"></script>
<script>
/* ============================================================================
   CONCEPT C — "What if every set gave you XP?"
   The shortest, most loop-friendly asset in the set: one question, one clean
   cause-and-effect loop, one level-up. Built to be rewatched.
   ========================================================================== */
const K = LEVLKit;
const { C, E, el, seg, lerp, px, fmt, rgba, icon, chroma, clamp01 } = K;

K.boot({ accent: C.green });
K.setImpacts([0.20, 2.30, 3.20, 4.10, 5.00, 6.40, 9.20], [6.40, 9.20]);
const DURATION = 12.0;
const W = K.world;

/* ---- 1. THE QUESTION (frame one) --------------------------------------- */
const q = el('div', W, {
  position:'absolute', left:'70px', right:'70px', top:'620px', textAlign:'center',
  fontSize:'116px', fontWeight:'800', letterSpacing:'-3px', lineHeight:'1.05',
}, 'WHAT IF<br>EVERY SET<br>GAVE YOU <span style="color:'+C.gold+'">XP</span>?');

/* ---- 2. THE LOOP: set -> XP -> bar -> level ---------------------------- */
const loopWrap = el('div', W, { position:'absolute', left:'0', right:'0', top:'520px', opacity:'0' });
const setCard = el('div', loopWrap, {
  margin:'0 auto', width:'720px', borderRadius:'34px', padding:'34px 40px',
  background:C.panel, border:'3px solid '+C.line,
  display:'flex', alignItems:'center', justifyContent:'space-between',
}, `<div><div style="font-size:22px;font-weight:800;letter-spacing:3px;color:${C.dim};text-transform:uppercase">Set logged</div>
     <div style="font-size:44px;font-weight:700;margin-top:8px">Barbell Bench Press</div>
     <div style="font-size:28px;color:${C.mut};margin-top:6px;font-variant-numeric:tabular-nums">100 kg × 5 · RPE 8</div></div>
    ${icon('train', 76, C.gold, 1.9)}`);

const xpChips = [0,1,2].map(i => el('div', W, {
  position:'absolute', left:'50%', top:'880px', padding:'16px 40px', borderRadius:'999px',
  background:rgba(C.green,0.18), border:'3px solid '+rgba(C.green,0.75),
  fontSize:'48px', fontWeight:'800', color:C.green, whiteSpace:'nowrap', opacity:'0',
  boxShadow:'0 0 44px '+rgba(C.green,0.6),
}, ['+128 XP','+142 XP','+134 XP'][i]));

const barWrap = el('div', W, { position:'absolute', left:'130px', right:'130px', top:'1080px', opacity:'0' });
const barHead = el('div', barWrap, { display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:'16px' },
  `<span style="font-size:26px;font-weight:800;letter-spacing:4px;color:${C.dim};text-transform:uppercase">Level 23</span>`);
const barVal = el('div', barHead, { fontSize:'38px', fontWeight:'800', color:C.gold, fontVariantNumeric:'tabular-nums' }, '0 XP');
const barTrack = el('div', barWrap, { height:'34px', borderRadius:'999px', background:C.sunken,
  border:'2px solid '+C.line, overflow:'hidden' });
const barFill = el('div', barTrack, { height:'100%', width:'0%', borderRadius:'999px',
  background:'linear-gradient(90deg,'+C.goldDeep+','+C.gold+')', boxShadow:'0 0 40px '+rgba(C.gold,0.85) });

/* ---- 3. LEVEL UP -------------------------------------------------------- */
const levelUp = el('div', W, { position:'absolute', left:'0', right:'0', top:'700px', textAlign:'center', opacity:'0' });
el('div', levelUp, { fontSize:'44px', fontWeight:'800', letterSpacing:'12px', color:C.gold, textTransform:'uppercase' }, 'Level up');
const lvlNum = el('div', levelUp, { fontSize:'260px', fontWeight:'800', letterSpacing:'-10px', lineHeight:'1.05',
  textShadow:'0 0 100px '+rgba(C.gold,0.9) }, '24');
const lvlRing = K.makeShockwave(W, rgba(C.gold,0.95));
const lvlSparks = K.makeSparks(W, 34, C.gold, 3737);

/* ---- 4. CLOSING LINE — matches frame one so the loop is seamless -------- */
const closer = el('div', W, {
  position:'absolute', left:'70px', right:'70px', top:'1180px', textAlign:'center', opacity:'0',
  fontSize:'62px', fontWeight:'800', letterSpacing:'2px',
}, 'WATCH → DO → <span style="color:'+C.gold+'">LEVEL UP</span>');

const endCard = K.makeEndCard(W, { tag:'Every set counts.', cta:'Link in bio' });

/* =============================================================== RENDER == */
window.renderAt = function(t){
  t = Math.max(0, Math.min(DURATION - 0.0001, t));
  K.frame(t);

  /* the question holds for two full beats, then clears */
  const qOut = seg(t, 1.85, 2.30);
  q.style.opacity = String(1 - qOut);
  q.style.transform = `translateY(${lerp(0,-120,E.outCubic(qOut))}px) scale(${lerp(1,0.7,E.outCubic(qOut))})`;
  chroma(q, lerp(14,0,E.outCubic(seg(t,0.05,0.42))));

  /* the loop */
  const lp = E.slam(seg(t, 2.30, 2.85));
  loopWrap.style.opacity = String(seg(t,2.30,2.44) * (1 - seg(t,6.10,6.45)));
  loopWrap.style.transform = `translateY(${lerp(70,0,lp)}px) scale(${lerp(0.8,1,lp)})`;

  const XP = [128,142,134];
  let total = 0;
  xpChips.forEach((n,i) => {
    const st = 3.20 + i*0.90;
    if (t >= st) total += XP[i];
    const qq = seg(t, st, st+0.85);
    n.style.opacity = qq>0 ? String(seg(t,st,st+0.07) * (1 - E.inCubic(seg(t,st+0.45,st+0.85)))) : '0';
    n.style.transform =
      `translate(calc(-50% + ${[-180,170,0][i]*E.outQuart(qq)}px), ${lerp(0,-190,E.outQuart(qq))}px) scale(${lerp(0.5,1,E.outBack(clamp01(qq*3)))})`;
  });
  // smooth the bar between steps instead of stepping it
  const lastI = [0,1,2].filter(i => t >= 3.20 + i*0.90).pop();
  const lastT = lastI === undefined ? 0 : 3.20 + lastI*0.90;
  const prevTotal = lastI === undefined ? 0 : XP.slice(0,lastI).reduce((a,b)=>a+b,0);
  const shown = lastI === undefined ? 0 : lerp(prevTotal, total, E.outQuart(seg(t, lastT, lastT+0.55)));
  barVal.textContent = fmt(shown) + ' XP';
  barFill.style.width = (clamp01(shown/404)*100).toFixed(1) + '%';
  barWrap.style.opacity = String(seg(t,2.60,2.95) * (1 - seg(t,6.10,6.45)));

  /* level up */
  const lu = seg(t, 6.40, 7.10);
  levelUp.style.opacity = String(seg(t,6.40,6.52) * (1 - seg(t,9.00,9.20)));
  levelUp.style.transform = `scale(${lerp(0.3,1,E.slam(lu))})`;
  chroma(lvlNum, lerp(32,0,E.outCubic(seg(t,6.40,7.05))));
  K.driveShockwave(lvlRing, seg(t,6.40,7.20), 7.4, 0, 880-960);
  K.driveSparks(lvlSparks, seg(t,6.40,7.35), 0, 880-960);

  closer.style.opacity = String(seg(t,7.30,7.65) * (1 - seg(t,9.00,9.20)));
  closer.style.transform = `scale(${lerp(1.3,1,E.slam(seg(t,7.30,7.85)))})`;

  if (t >= 9.20) endCard.drive(t - 9.20); else endCard.root.style.opacity = '0';
};
window.DURATION = DURATION;
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
