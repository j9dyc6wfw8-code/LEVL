<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LEVL — Pack Pull</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#05060a}
  body{font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0d13}
  #world{position:absolute;inset:0;will-change:transform}
  svg{display:block}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="levl-kit.js"></script>
<script>
/* ============================================================================
   CONCEPT M — "20 XP from a pack."
   The report's "Mystery Reward" angle on LEVL's real Pack Meter. The 1,200 XP
   step is the engine's actual PACK_XP_STEP, and the payoff deliberately ends on
   the integrity line — packs pay cosmetics, never rank — because that is the
   app's genuine differentiator against every loot-box fitness game.
   ========================================================================== */
const K = LEVLKit;
const { C, E, el, seg, lerp, px, fmt, rgba, icon, chroma, clamp01, RARITY, PACK_XP_STEP } = K;

K.boot({ accent: C.orange });
K.setImpacts([0.22, 1.70, 2.60, 4.10, 5.30, 6.10, 6.90, 7.70, 8.60, 10.40, 11.80],
             [4.10, 8.60, 11.80]);
const DURATION = 15.0;
const W = K.world;

const START_XP = 1180;

/* ---- 1. HOOK: 20 XP from a pack ---------------------------------------- */
const hookWrap = el('div', W, { position:'absolute', left:'0', right:'0', top:'340px', textAlign:'center' });
const hookNum = el('div', hookWrap, {
  fontSize:'210px', fontWeight:'800', color:C.gold, letterSpacing:'-8px', lineHeight:'1',
  textShadow:'0 0 90px '+rgba(C.gold,0.85),
}, '20');
const hookLbl = el('div', hookWrap, {
  fontSize:'54px', fontWeight:'800', letterSpacing:'8px', textTransform:'uppercase', marginTop:'8px',
}, 'XP from a pack');

/* ---- 2. THE PACK METER (engine: PACK_XP_STEP = 1200) -------------------- */
const meterWrap = el('div', W, { position:'absolute', left:'130px', right:'130px', top:'700px' });
const meterHead = el('div', meterWrap, {
  display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:'18px',
}, `<span style="font-size:26px;font-weight:800;letter-spacing:4px;color:${C.dim};text-transform:uppercase">Pack meter</span>`);
const meterVal = el('div', meterHead, {
  fontSize:'42px', fontWeight:'800', color:C.gold, fontVariantNumeric:'tabular-nums',
}, '1,180 / 1,200');
const meterTrack = el('div', meterWrap, {
  height:'34px', borderRadius:'999px', background:C.sunken, border:'2px solid '+C.line, overflow:'hidden',
});
const meterBar = el('div', meterTrack, {
  height:'100%', width:'0%', borderRadius:'999px',
  background:'linear-gradient(90deg,'+C.goldDeep+','+C.gold+')', boxShadow:'0 0 40px '+rgba(C.gold,0.85),
});

/* ---- 3. THE LOCKED PACK ------------------------------------------------- */
const pack = el('div', W, {
  position:'absolute', left:'50%', top:'1080px', width:'340px', height:'340px',
  marginLeft:'-170px', marginTop:'-170px', borderRadius:'46px',
  background:'linear-gradient(165deg,#2a3142,#141924)', border:'4px solid '+C.line,
  display:'flex', alignItems:'center', justifyContent:'center', transformOrigin:'50% 50%',
}, icon('packs', 190, C.dim, 1.5));
const packGlow = el('div', W, {
  position:'absolute', left:'50%', top:'1080px', width:'620px', height:'620px',
  marginLeft:'-310px', marginTop:'-310px', borderRadius:'999px', opacity:'0', pointerEvents:'none',
  background:'radial-gradient(circle, '+rgba(C.gold,0.55)+' 0%, rgba(0,0,0,0) 68%)', mixBlendMode:'screen',
});
const setChip = el('div', W, {
  position:'absolute', left:'50%', top:'1330px', marginLeft:'-190px', width:'380px',
  padding:'16px 0', borderRadius:'999px', textAlign:'center', opacity:'0',
  background:rgba(C.green,0.18), border:'3px solid '+rgba(C.green,0.75),
  fontSize:'40px', fontWeight:'800', color:C.green, boxShadow:'0 0 40px '+rgba(C.green,0.55),
}, '+140 XP');

/* ---- 4. RARITY CASCADE -------------------------------------------------- */
/* The reel flicks through the ladder the way the reveal does, landing on Mythic. */
const CASCADE = [
  { r:RARITY[0], t:5.30 }, { r:RARITY[1], t:6.10 }, { r:RARITY[2], t:6.90 },
  { r:RARITY[3], t:7.70 }, { r:RARITY[4], t:8.60 },
];
const cascadeHead = el('div', W, {
  position:'absolute', left:'0', right:'0', top:'770px', textAlign:'center', opacity:'0',
  fontSize:'34px', fontWeight:'800', letterSpacing:'8px', color:C.gold, textTransform:'uppercase',
}, 'Pack opened');
const cards = CASCADE.map(c => {
  const n = el('div', W, {
    position:'absolute', left:'50%', top:'950px', width:'420px', height:'560px',
    marginLeft:'-210px', borderRadius:'44px', opacity:'0',
    background:'linear-gradient(180deg,'+rgba(c.r.c,0.34)+','+rgba(c.r.c,0.08)+')',
    border:'4px solid '+rgba(c.r.c,0.9), display:'flex', flexDirection:'column',
    alignItems:'center', justifyContent:'center', gap:'26px', transformOrigin:'50% 50%',
  }, `${icon('packs',130,c.r.c,1.9)}
      <div style="font-size:40px;font-weight:800;letter-spacing:3px;color:${c.r.c};text-transform:uppercase;text-shadow:0 0 34px ${rgba(c.r.c,0.95)}">${c.r.label}</div>`);
  return { n, ...c };
});
const mythicRing = K.makeShockwave(W, rgba('#ff4d6d',0.95));
const mythicSparks = K.makeSparks(W, 36, '#ff4d6d', 4949);

/* ---- 5. THE INTEGRITY LINE — the actual differentiator ------------------ */
const integrity = el('div', W, {
  position:'absolute', left:'80px', right:'80px', top:'880px', textAlign:'center', opacity:'0',
}, `<div style="font-size:56px;font-weight:800;letter-spacing:1px">COSMETICS ONLY.</div>
    <div style="font-size:56px;font-weight:800;letter-spacing:1px;color:${C.gold};margin-top:6px">NEVER RANK.</div>
    <div style="font-size:28px;font-weight:600;color:${C.mut};margin-top:20px">Nothing you open can buy you a place on the ladder.</div>`);

const endCard = K.makeEndCard(W, { tag:'Earn it. Don\'t buy it.', cta:'Link in bio' });

/* =============================================================== RENDER == */
window.renderAt = function(t){
  t = Math.max(0, Math.min(DURATION - 0.0001, t));
  K.frame(t);

  const revealStart = 4.10;

  /* hook clears once the meter takes over */
  const hookOut = seg(t, 1.55, 2.05);
  hookWrap.style.opacity = String(1 - hookOut);
  hookWrap.style.transform = `translateY(${lerp(0,-160,E.outCubic(hookOut))}px) scale(${lerp(1,0.55,E.outCubic(hookOut))})`;
  chroma(hookNum, lerp(15,0,E.outCubic(seg(t,0.05,0.40))));

  /* the set lands at 2.60 and fills the meter past 1,200 */
  const gain = E.outExpo(seg(t, 2.60, 3.90));
  const xp = lerp(START_XP, START_XP + 140, gain);
  const capped = Math.min(xp, PACK_XP_STEP);
  meterVal.textContent = `${fmt(capped)} / ${fmt(PACK_XP_STEP)}`;
  meterVal.style.color = capped >= PACK_XP_STEP ? C.green : C.gold;
  meterBar.style.width = (clamp01(capped / PACK_XP_STEP) * 100).toFixed(2) + '%';
  const meterOut = seg(t, 4.30, 4.80);
  meterWrap.style.opacity = String(seg(t,0.15,0.45) * (1 - meterOut));

  setChip.style.opacity = String(seg(t,2.60,2.72) * (1 - seg(t,3.90,4.30)));
  setChip.style.transform = `scale(${lerp(0.5,1,E.slam(seg(t,2.60,3.10)))})`;

  /* pack rattles as the meter closes, then bursts */
  const opened = seg(t, revealStart, revealStart + 0.35);
  const rattle = seg(t, 3.10, revealStart);
  const shake = rattle > 0 && rattle < 1 ? Math.sin(t*70) * 14 * rattle : 0;
  pack.style.opacity = String(seg(t,0.6,0.9) * (1 - opened));
  pack.style.transform =
    `translateX(${shake}px) rotate(${shake*0.35}deg) scale(${lerp(1,1.9,E.inCubic(opened))})`;
  pack.style.filter = `blur(${opened*20}px)`;
  pack.style.borderColor = rattle > 0.4 ? rgba(C.gold, 0.4 + rattle*0.6) : C.line;
  // rattle glow must die when the pack bursts, or it hangs for the whole reel
  const glowRattle = rattle * (1 - opened) * 0.5;
  const glowBurst  = t >= revealStart
    ? Math.pow(1 - clamp01(seg(t, revealStart, revealStart + 0.9)), 2) * 0.9 : 0;
  packGlow.style.opacity = String(glowRattle + glowBurst);

  /* rarity cascade — each card slams in and is replaced by the next */
  cards.forEach((c,i) => {
    const isLast = i === cards.length - 1;
    const nextT = isLast ? DURATION : cards[i+1].t;
    const inQ = seg(t, c.t, c.t + 0.22);
    // the card must be GONE before the payoff line arrives — cross-dissolving
    // type over a glowing card makes both unreadable
    const outQ = isLast ? seg(t, 10.10, 10.45) : seg(t, nextT - 0.10, nextT);
    const vis = inQ * (1 - outQ);
    c.n.style.opacity = String(vis);
    const slamQ = E.slam(seg(t, c.t, c.t + (isLast ? 0.75 : 0.40)));
    c.n.style.transform =
      `translateY(${lerp(-160,0,slamQ)}px) scale(${lerp(isLast?2.4:1.55, 1, slamQ)}) rotate(${lerp(isLast?-10:6,0,E.outQuart(seg(t,c.t,c.t+0.5)))}deg)`;
    c.n.style.filter = `blur(${lerp(isLast?18:10,0,E.outQuart(seg(t,c.t,c.t+0.22)))}px)`;
    c.n.style.boxShadow = `0 24px 90px ${rgba(c.r.c,0.5)}, 0 0 ${70 + 90*(1-clamp01(seg(t,c.t,c.t+0.6)))}px ${rgba(c.r.c,0.75)}`;
  });
  cascadeHead.style.opacity = String(seg(t, 5.30, 5.55) * (1 - seg(t, 10.10, 10.45)));
  K.driveShockwave(mythicRing, seg(t, 8.60, 9.40), 7.4, 0, 1230-960);
  K.driveSparks(mythicSparks, seg(t, 8.60, 9.55), 0, 1230-960);

  /* integrity payoff — lands on a clean frame */
  const ig = seg(t, 10.55, 10.95);
  integrity.style.opacity = String(ig * (1 - seg(t, 11.55, 11.80)));
  integrity.style.transform = `scale(${lerp(1.25,1,E.slam(ig))})`;

  if (t >= 11.80) endCard.drive(t - 11.80); else endCard.root.style.opacity = '0';
};
window.DURATION = DURATION;
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
