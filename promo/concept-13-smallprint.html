<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LEVL — The Small Print</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#05060a}
  body{font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0d13}
  #world{position:absolute;inset:0;will-change:transform}
  svg{display:block}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="levl-kit.js"></script>
<script>
/* ============================================================================
   CONCEPT 13 — "THE SMALL PRINT"
   Pivot: unreadable legalese -> the one clause that is LEVL's whole moat.
   Pure typographic scale. Nothing morphs; the scroll stops and a single line
   grows out of the body text.

   Every claim shown is verifiable in the engine:
     - packs pay coins, never XP        (PACK_TYPES coinRange; XP removed)
     - cosmetics never touch rank/FR    (cosmetics catalog comment, engine.js)
     - DAILY_XP_CAP = 4000              (INTEGRITY.DAILY_XP_CAP)
   ========================================================================== */
const K = LEVLKit;
const { C, E, el, seg, lerp, px, fmt, rgba, icon, chroma, clamp01 } = K;

K.boot({ accent: C.blue, grid:false });
/* Nothing between 5.10 and 6.40 — the scroll slams into silence. */
K.setImpacts([0.20, 1.40, 2.60, 3.80, 5.05, 6.40, 9.40, 12.20], [6.40, 9.40, 12.20]);
const DURATION = 15.2;
const W = K.world;

/* ---- the wall of text --------------------------------------------------- */
const LEGAL = [
  'These terms govern your access to and use of the service, including any content, functionality and services offered on or through the application.',
  'By creating an account you represent that you are of legal age to form a binding contract and are not barred from receiving services under applicable law.',
  'The service is provided on an "as is" and "as available" basis without warranties of any kind, whether express or implied, including but not limited to the implied warranties of merchantability and fitness for a particular purpose.',
  'You retain ownership of content you submit. You grant a worldwide, non-exclusive, royalty-free licence to host, store, reproduce and display such content solely for the purpose of operating and improving the service.',
  'We may modify, suspend or discontinue any part of the service at any time, with or without notice, and shall not be liable to you or any third party for any such modification, suspension or discontinuance.',
  'Subscriptions renew automatically at the end of each billing period unless cancelled at least twenty-four hours before the renewal date through the platform on which the subscription was purchased.',
  'Nothing in these terms excludes or limits liability for death or personal injury arising from negligence, for fraud or fraudulent misrepresentation, or for any other liability that cannot be excluded by law.',
  'You agree not to reverse engineer, decompile or disassemble any portion of the service, nor to access it by any automated means except as expressly permitted.',
  'Where a provision is found to be unenforceable, the remaining provisions shall continue in full force and effect, and the unenforceable provision shall be modified to the minimum extent necessary.',
  'Any dispute arising out of or in connection with these terms shall be subject to the exclusive jurisdiction of the courts of England and Wales.',
];
const scroller = el('div', W, {
  position:'absolute', left:'90px', right:'90px', top:'0', willChange:'transform',
});
const paras = [];
for (let pass = 0; pass < 3; pass++){
  LEGAL.forEach((txt, i) => {
    paras.push(el('div', scroller, {
      fontSize:'25px', lineHeight:'1.55', color:'#5d6472', marginBottom:'26px',
      fontWeight:'400', textAlign:'justify',
    }, `<span style="font-weight:700;color:#6b7488">${pass*10 + i + 1}.</span> ${txt}`));
  });
}

/* header that sells the disguise */
const header = el('div', W, {
  position:'absolute', left:'0', right:'0', top:'150px', textAlign:'center', zIndex:'5',
  paddingBottom:'22px',
  background:'linear-gradient(180deg,'+C.bg+' 62%,rgba(11,13,19,0) 100%)',
}, `<div style="font-size:32px;font-weight:800;letter-spacing:6px;color:${C.dim};text-transform:uppercase">Terms of Service</div>
    <div style="font-size:23px;font-weight:600;color:${C.faint};margin-top:8px">Last updated 16 August 2026</div>`);

/* ---- the clause that stops the scroll ---------------------------------- */
const clause = el('div', W, {
  position:'absolute', left:'70px', right:'70px', top:'620px', textAlign:'center', opacity:'0',
  fontSize:'74px', fontWeight:'800', letterSpacing:'-1.5px', lineHeight:'1.2',
}, 'Nothing purchasable<br>may affect rank, XP,<br>stats or Fitness Rating.');
const clauseNo = el('div', W, {
  position:'absolute', left:'0', right:'0', top:'500px', textAlign:'center', opacity:'0',
  fontSize:'30px', fontWeight:'800', letterSpacing:'8px', color:C.gold, textTransform:'uppercase',
}, 'Clause 7.2');

/* ---- the receipts ------------------------------------------------------- */
const receipts = el('div', W, { position:'absolute', left:'110px', right:'110px', top:'1080px', opacity:'0' });
[['Packs pay coins.', 'Never XP.'],
 ['Cosmetics change how you look.', 'Never where you rank.'],
 ['4,000 XP daily cap.', 'The ladder can\'t be farmed.']].forEach(([a,b]) => {
  const r = el('div', receipts, {
    display:'flex', alignItems:'center', gap:'22px', padding:'24px 30px', borderRadius:'24px',
    background:C.panel, border:'2px solid '+C.lineSoft, marginBottom:'16px',
  });
  el('div', r, { width:'44px', height:'44px', borderRadius:'999px', flexShrink:'0',
    background:rgba(C.green,0.18), border:'2px solid '+C.green,
    display:'flex', alignItems:'center', justifyContent:'center',
    fontSize:'26px', fontWeight:'800', color:C.green }, '✓');
  el('div', r, { flex:'1' },
    `<div style="font-size:31px;font-weight:700">${a}</div>
     <div style="font-size:27px;font-weight:600;color:${C.gold};margin-top:2px">${b}</div>`);
});

const closer = el('div', W, {
  position:'absolute', left:'70px', right:'70px', top:'1360px', textAlign:'center', opacity:'0',
  fontSize:'56px', fontWeight:'800', letterSpacing:'1px',
}, 'We put it in writing.');

const ring = K.makeShockwave(W, rgba(C.gold,0.85));
const endCard = K.makeEndCard(W, { tag:'A ladder you can\'t buy.', cta:'Link in bio' });

/* =============================================================== RENDER == */
window.renderAt = function(t){
  t = Math.max(0, Math.min(DURATION - 0.0001, t));
  K.frame(t);

  /* ---- the scroll: accelerates absurdly, then slams to a stop ------------ */
  // ease-in so it starts at a believable reading speed and ends impossible
  const runup = clamp01(seg(t, 0.0, 5.10));
  const dist = lerp(0, 7200, E.inQuart(runup));
  const stop = seg(t, 5.10, 5.40);
  const y = 240 - dist;
  const blur = lerp(0, 16, E.inQuart(runup)) * (1 - E.outQuart(stop));
  scroller.style.transform = `translateY(${y}px)`;
  scroller.style.filter = `blur(${blur}px)`;

  const fade = seg(t, 5.55, 6.40);
  scroller.style.opacity = String((1 - fade) * (1 - seg(t,6.4,6.6)));
  header.style.opacity = String(seg(t,0.05,0.4) * (1 - fade));

  /* ---- the clause grows out of the body text ----------------------------- */
  const cl = seg(t, 6.40, 7.20);
  clause.style.opacity = String(seg(t, 6.40, 6.62) * (1 - seg(t, 12.00, 12.20)));
  // starts at body-text size and scales up to headline — the "zoom into the fine print"
  clause.style.transform = `scale(${lerp(0.34, 1, E.outQuint(cl))})`;
  chroma(clause, lerp(16, 0, E.outCubic(seg(t, 6.40, 7.05))));
  clauseNo.style.opacity = String(seg(t, 6.85, 7.25) * (1 - seg(t, 12.00, 12.20)));
  K.driveShockwave(ring, seg(t, 6.40, 7.30), 6.2, 0, 720-960);

  /* ---- receipts ---------------------------------------------------------- */
  receipts.style.opacity = String(seg(t, 9.40, 9.80) * (1 - seg(t, 12.00, 12.20)));
  Array.from(receipts.children).forEach((r,i) => {
    const st = 9.40 + i*0.30;
    const q = E.slam(seg(t, st, st+0.42));
    r.style.opacity = String(seg(t, st, st+0.14));
    r.style.transform = `translateX(${lerp(-70,0,q)}px)`;
  });

  closer.style.opacity = String(seg(t, 11.20, 11.60) * (1 - seg(t, 12.00, 12.20)));
  closer.style.transform = `scale(${lerp(1.2,1,E.slam(seg(t,11.20,11.75)))})`;

  if (t >= 12.20) endCard.drive(t - 12.20); else endCard.root.style.opacity = '0';
};
window.DURATION = DURATION;
window.renderAt(0);
window.READY = true;
</script>
</body>
</html>
