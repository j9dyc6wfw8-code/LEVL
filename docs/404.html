  :root[data-theme="dark"]{

    --muted:#A0A6AE; --faint:#8A919A; --accent:#D9B45A; --otc:#FF8A80;

  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--text);font-family:var(--sans);
    font-size:17px;line-height:1.65;margin:0;padding:0 22px 88px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto}

  nav.pages ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 16px}
  nav.pages li{margin:0}
  nav.pages a[aria-current="page"]{color:var(--accent);text-decoration:none;font-weight:600}
  header{padding:36px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;

  h1{font-size:clamp(30px,5vw,40px);line-height:1.1;letter-spacing:-.028em;margin:0 0 10px;font-weight:700}

  h3{font-size:17px;margin:26px 0 8px;font-weight:700}
  p,li{color:var(--muted);max-width:66ch}
  strong{color:var(--text);font-weight:600}
  ul,ol{padding-left:20px}
  li{margin-bottom:7px}
  a{color:var(--text);text-decoration-color:var(--accent);text-underline-offset:3px}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tbl{overflow-x:auto;margin:16px 0}
  table{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
  caption{text-align:left;color:var(--faint);font-size:13px;padding-bottom:6px}
  th,td{text-align:left;padding:10px 14px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  td{color:var(--muted)}
  td:first-child{color:var(--text);font-weight:600}
  .callout{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:3px;padding:16px 18px;margin:20px 0}
  .callout p{margin:0}
  .callout p+p,.callout ul{margin-top:10px}
  mark.otc{background:transparent;color:var(--otc);border:1.5px dashed var(--otc);border-radius:3px;
    padding:0 4px;font-family:var(--mono);font-size:.8em;font-weight:600}
  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--faint);font-size:14px}
  code{font-family:var(--mono);font-size:.9em;background:var(--surface);
    border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--accent)}
  @media (max-width:480px){body{padding:0 16px 64px;font-size:16px}}
  .hero{display:flex;align-items:center;gap:18px;margin:0 0 6px}
  .hero img{width:72px;height:72px;border-radius:17px;flex:none}
  .hero .brand{margin:0}
  .lede{font-size:19px;color:var(--text);max-width:60ch}
  .status{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  .links{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .links li{margin:0}
  .links a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-decoration:none;color:var(--text);font-weight:600}
  .links a span{display:block;font-weight:400;color:var(--muted);font-size:15px;margin-top:2px}
